<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div class="liquid-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="glass-header">
        <nav class="container">
            <a href="{{ "/" | relative_url }}" class="logo">{{ site.title }}</a>
            <div class="nav-links">
                <a href="{{ "/" | relative_url }}">Profile</a>
                <a href="{{ "/case-studies/" | relative_url }}">Case Studies</a>
                <a href="mailto:singhvks@outlook.in" class="cta-button">Contact</a>
            </div>
        </nav>
    </header>

    <main class="container">
        {{ content }}
    </main>

    <footer class="glass-footer">
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }} | Data Architect & Principal AI Engineer</p>
        </div>
    </footer>

    <script src="{{ "/assets/js/main.js" | relative_url }}"></script>
</body>
</html>
